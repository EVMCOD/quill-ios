name: Quill
options:
  bundleIdPrefix: app.quill
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
  createIntermediateGroups: true
  xcodeVersion: "15.4"

# Locales shipped in v1.0
knownRegions:
  - en
  - es
  - fr
  - de
  - it
  - pt-BR
  - Base

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: KADHS6P8PY
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    ENABLE_PREVIEWS: YES
    OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-function-bodies=300"

targets:

  # ─── iOS App ─────────────────────────────────────────────────
  Quill:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Quill
      - path: SharedInboxBridge.swift
    dependencies:
      - target: QuillShare
        embed: true
        codeSign: true
    info:
      path: Quill/Info.plist
      properties:
        CFBundleDisplayName: Quill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIUserInterfaceStyle: ""
        NSUserActivityTypes:
          - AddArticleIntent
        NSHumanReadableCopyright: "© 2026"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quill.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarStyle: ""
        CODE_SIGN_ENTITLEMENTS: Quill/Quill.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Quill/Quill.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.quill.shared

  # ─── iOS Share Extension ───────────────────────────────────
  QuillShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuillShare
      - path: SharedInboxBridge.swift
    info:
      path: QuillShare/Info.plist
      properties:
        CFBundleDisplayName: Quill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quill.ios.share
        CODE_SIGN_ENTITLEMENTS: QuillShare/QuillShare.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: QuillShare/QuillShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.quill.shared

  # ─── macOS App ─────────────────────────────────────────────
  QuillMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Quill
      - path: SharedInboxBridge.swift
    info:
      path: QuillMac/Info.plist
      properties:
        CFBundleDisplayName: Quill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026"
        NSPrincipalClass: NSApplication
        NSUserActivityTypes:
          - AddArticleIntent
        NSDesktopFolderUsageDescription: "Quill needs to read the Obsidian vault you pick to keep your saved articles in sync."
        NSDocumentsFolderUsageDescription: "Quill stores your reading queue and the local SwiftData store inside your Documents folder."
        NSRemovableVolumesUsageDescription: "Quill writes markdown files inside your chosen Obsidian vault for captured articles and highlights."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quill.macos
        CODE_SIGN_ENTITLEMENTS: QuillMac/QuillMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        LSUIElement: NO
    entitlements:
      path: QuillMac/QuillMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.app.quill.shared
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true

  # ─── UI Tests ──────────────────────────────────────────────
  QuillUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: QuillUITests
    dependencies:
      - target: Quill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quill.ios.uitests
        TEST_TARGET_NAME: Quill

schemes:
  Quill:
    build:
      targets:
        Quill: all
        QuillShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuillUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  QuillMac:
    build:
      targets:
        QuillMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
